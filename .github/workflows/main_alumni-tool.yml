name: Deploy to Azure Web App

on:
  push:
    branches: [main]

concurrency:
  group: azure-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Install frontend dependencies
        working-directory: frontend/my-app
        run: npm ci

      - name: Build frontend
        working-directory: frontend/my-app
        run: npm run build

      - name: Zip artifact for deployment
        run: zip -r release.zip backend frontend startup.sh -x "**/.git/**"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Alumni-Tool"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_97F365B25F8C4EC6908F706AD4EADFB3 }}
          package: release.zip
